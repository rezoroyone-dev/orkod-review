services:
  db:
    image: postgres:15-alpine
    restart: always
    container_name: Phealing_DB
    volumes:
      - ./volumes/data/db:/var/lib/postgresql/data:rw
    # ports:
    #   - 5432:5432
    expose:
      - 5432
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-phealing}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME:-phealing}"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - shared_network

  app:
    image: phealing-server:1.25
    build:
      context: ./
      # dockerfile: Dockerfile.app-prod
      dockerfile: Dockerfile.app-dev
    restart: no
    container_name: Phealing_Server
    # command: /opt/PhealingServer/bin/PranicServer -config=/opt/PhealingServer/dataRoot/config.json
    # command: ping 192.168.5.136
    env_file:
      - .env
    volumes:
      - ./volumes/pranicHealing/dataRoot:/opt/PhealingServer/dataRoot
      - ./volumes/caddy/data/caddy/certificates/local/orkodcenter.local:/opt/certificates:ro
      # - ./volumes/certbot/conf/archive/orkodcenter.com/:/opt/certbot/:ro
      # - ./src/phealing/bin/PranicServer:/opt/PhealingServer/bin/PranicServer
    # ports:
    # - 443:443
    # - 9091:9091
    expose:
      - 9091
      - 443
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared_network

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # command: ["ping", "192.168.5.136"]
    ports:
      - 80:80
      - 443:443
      - 8443:8443
      # - "443:443/udp"
      # - "2019:2019"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./frontend/.env.dev
    volumes:
      - ./volumes/sites:/srv
      - ./volumes/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
      - ./volumes/caddy/logs:/logs
    depends_on:
      - app
    networks:
      - shared_network

